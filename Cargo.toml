[workspace]
resolver = "2"
members = [
    "crates/birkat-core",
    "crates/birkat-crypto",
    "crates/birkat-audit",
    "crates/birkat-evidence",
    "crates/birkat-audio",
    "crates/birkat-transcription",
    "crates/birkat-udf",
    "crates/birkat-report",
    "crates/birkat-backup",
    "crates/birkat-updater",
    "crates/birkat-app",
    "crates/birkat-cli",
    "crates/birkat-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["BİRKÂT Geliştirme Ekibi"]

[workspace.dependencies]
# --- serileştirme ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- hata yönetimi ---
thiserror = "2"
anyhow = "1"

# --- kimlik / zaman ---
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# --- kriptografi ---
aes-gcm = { version = "0.10", features = ["aes", "std"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
base64 = "0.22"
hex = "0.4"

# --- depolama ---
rusqlite = { version = "0.43", features = ["bundled", "serde_json", "chrono"] }
zip = { version = "9", default-features = false, features = ["deflate", "time"] }
quick-xml = { version = "0.42", features = ["serialize"] }

# --- dosya sistemi ---
walkdir = "2"
tempfile = "3"

# --- medya ---
symphonia = { version = "0.5", features = [
    "wav", "pcm", "mp3", "flac", "ogg", "vorbis", "aac", "isomp4", "alac", "aiff", "caf", "adpcm", "mkv",
] }
hound = "3"

# --- transkripsiyon (opsiyonel, agir) ---
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
candle-transformers = { version = "0.11" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# --- arayuz ---
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"

# --- komut satiri / gunluk ---
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- yerel paketler ---
birkat-core = { path = "crates/birkat-core" }
birkat-crypto = { path = "crates/birkat-crypto" }
birkat-audit = { path = "crates/birkat-audit" }
birkat-audio = { path = "crates/birkat-audio" }
birkat-transcription = { path = "crates/birkat-transcription" }
birkat-udf = { path = "crates/birkat-udf" }
birkat-report = { path = "crates/birkat-report" }
birkat-backup = { path = "crates/birkat-backup" }
birkat-updater = { path = "crates/birkat-updater" }
birkat-app = { path = "crates/birkat-app" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 1
